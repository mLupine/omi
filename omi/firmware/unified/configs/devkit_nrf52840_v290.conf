# Unified DevKit v2 Firmware Configuration (nRF52840) - SDK v2.9.0
# This configuration upgrades DevKit v2 to SDK v2.9.0 and adds HAL support
# while maintaining DevKit functionality within nRF52840 constraints

#
# Hardware settings
#
CONFIG_GPIO=y
CONFIG_NRFX_PDM=y
CONFIG_FLASH=y
CONFIG_ADC=y

# Unified build configuration - using compile definitions instead of Kconfig for now
# These will be defined as compiler flags in CMakeLists.txt:
# CONFIG_OMI_UNIFIED_BUILD=y
# CONFIG_OMI_PLATFORM_NRF52840=y
# CONFIG_OMI_HAL=y
# CONFIG_OMI_MEMORY_CONSTRAINED=y
# CONFIG_OMI_SINGLE_CORE=y

#
# Bluetooth settings (upgraded to match production)
#
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Omi DevKit 2 Unified"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_GATT_DYNAMIC_DB=y

# Max transmit power supported by nRF52840
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8
CONFIG_BT_PHY_UPDATE=y

# Battery and Device Information services
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL="Omi DevKit 2 Unified"
CONFIG_BT_DIS_MANUF="Based Hardware"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_FW_REV_STR="unified-devkit-v1.0"
CONFIG_BT_DIS_HW_REV_STR="Seeed Xiao BLE Sense"

# Large BLE packets / BLE Buffers (match production)
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=400000
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_BUF_ACL_RX_SIZE=1024
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=2048
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

CONFIG_FPU=y
CONFIG_NORDIC_QSPI_NOR=n

#
# Console and Logging (disabled by default for production)
#
CONFIG_CONSOLE=n
CONFIG_PRINTK=n

#
# SD Card Support (DevKit primary storage)
#
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_EXFAT=y

# Memory constraints for nRF52840
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

#
# Disable unused peripherals to save memory
#
CONFIG_I2C=n

#
# LSM6DSL sensor (accelerometer and gyroscope) - disabled for initial builds
#
# CONFIG_LSM6DSL=y
# CONFIG_LSM6DSL_ENABLE_TEMP=n
# CONFIG_SENSOR=y

#
# Audio processing - simplified for initial builds
#
# CONFIG_I2S=y
# CONFIG_I2S_NRFX=y
CONFIG_SPI_NRFX=y

#
# Ring buffer for audio processing
#
CONFIG_RING_BUFFER=y

# Power management
CONFIG_PM_DEVICE=y

#
# Omi features configuration (adapted for DevKit constraints)
#
# Temporarily disable Opus codec to fix build issues
# CONFIG_OMI_CODEC_OPUS=y
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=y
CONFIG_OMI_ENABLE_ACCELEROMETER=n
CONFIG_OMI_ENABLE_BUTTON=y
CONFIG_OMI_ENABLE_SPEAKER=y
CONFIG_OMI_ENABLE_BATTERY=y
CONFIG_OMI_ENABLE_USB=y
CONFIG_OMI_ENABLE_HAPTIC=y

# DevKit-specific features
CONFIG_OMI_ENABLE_SD_CARD=y
CONFIG_OMI_ENABLE_USB_DEBUG=y

# Build version - using compile definitions
# CONFIG_OMI_BUILD_VERSION_STRING="unified-devkit-v1.0"

# HAL configuration for DevKit - using compile definitions
# CONFIG_OMI_HAL_LOG_LEVEL_INF=y
# CONFIG_OMI_DEVKIT_COMPATIBILITY=y