# Unified Production Firmware Configuration (nRF5340)
# This configuration provides a minimal build for testing unified architecture

# Basic Zephyr configuration
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_ADC=y

# Power management  
CONFIG_PM_DEVICE=y

# File system support
CONFIG_FILE_SYSTEM=y

# Ring buffer
CONFIG_RING_BUFFER=y

# Unified build configuration - using compile definitions instead of Kconfig for now
# These will be defined as compiler flags in CMakeLists.txt:
# CONFIG_OMI_UNIFIED_BUILD=y
# CONFIG_OMI_PLATFORM_NRF5340=y
# CONFIG_OMI_HAL=y

# Basic Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Omi Production Unified"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_APPEARANCE=22

# Console and logging (enable for debugging)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Memory configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Disable features that might cause build issues initially
# CONFIG_OMI_CODEC_OPUS=n
# CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n
# CONFIG_OMI_ENABLE_WIFI=n

# Additional unified build specific settings - using compile definitions
# CONFIG_OMI_BUILD_VERSION_STRING="unified-production-v1.0"
# CONFIG_OMI_PRODUCTION_COMPATIBILITY=y