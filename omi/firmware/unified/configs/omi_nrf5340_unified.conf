# Unified Production Firmware Configuration (nRF5340)
# This configuration extends the original production config with HAL support
# while preserving all existing functionality

# Include original production configuration
include ../omi/omi.conf

# Unified build configuration
CONFIG_OMI_UNIFIED_BUILD=y
CONFIG_OMI_PLATFORM_NRF5340=y

# HAL support
CONFIG_OMI_HAL=y
CONFIG_OMI_HAL_AUDIO=y
CONFIG_OMI_HAL_BLUETOOTH=y
CONFIG_OMI_HAL_STORAGE=y
CONFIG_OMI_HAL_PLATFORM=y

# Enable unified monitoring and telemetry 
CONFIG_OMI_UNIFIED_MONITORING=y

# Maintain all existing production features
# (All CONFIG_OMI_ENABLE_* flags inherited from original omi.conf)

# Additional unified build specific settings
CONFIG_OMI_BUILD_VERSION_STRING="unified-production-v1.0"
CONFIG_OMI_HAL_LOG_LEVEL_INF=y

# Enable backward compatibility mode for production code
CONFIG_OMI_PRODUCTION_COMPATIBILITY=y